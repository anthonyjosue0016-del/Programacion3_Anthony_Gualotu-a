<!DOCTYPE html>
<htlm lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link rel="stylesheet" href="04_display.css">
    <link rel="stylesheet" href="04_reset.css">
</head>
<body>
    <h1 style="color: #e63946">DISPLAY</h1>
    <div class="banner-oferta">🔥 Oferta especial: 20% en laptops </div><br>
    
    <div class="etiqueta-nuevo">Nuevo Producto</div> <br><br>
    <button class="btn-carrito">Agregar al carrito</button><br><br>

    <button onclick="toggleMenu()">Menu</button>
    <div class="menu-movil" id="menu">
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </div>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('activo');
        }
    </script>
</body>
</html>
