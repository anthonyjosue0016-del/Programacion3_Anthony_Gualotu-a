<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con Validación</title>
</head>
<body>
    <h1>Formularios con Validación</h1>
    <form>
        <fieldset>
            <legend>Campo obligatorio</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required><br>
        </fieldset>
        <fieldset>
            <legend>Minlength / Maxlength</legend>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" minlength="2" maxlength="100"><br>
        </fieldset>
        <fieldset>
            <legend>Patron de Caracteres - Expresión Regular</legend>
            <label for="codigo-postal">Codigo Postal:</label>
            <input type="text" id="codigo-postal" name="codigo-postal" pattern="[0-9]{5}" title="Ingrese un código postal de 5 dígitos"><br>
        </fieldset>
        <fieldset>
            <legend>min / max rango para núnmeros</legend>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="0" max="120"><br>
        </fieldset>
        <fieldset>
            <legend>Deshabilitado</legend>
            <label for="ref">Referencia:</label>
            <input type="text" id="ref" name="ref" value="REF-001" disabled><br>
        </fieldset>
        <fieldset>
            <legend>Solo lectura</legend>
            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais"  value="Ecuador" readonly><br>
        </fieldset>
        <button type="submit">Crear Cuenta</button>
    </form>
        
</body>
</html>
