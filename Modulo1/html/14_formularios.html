<!DOCTYPE html>
<htlm lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <form action="/procesar" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Enviar">
    </form>

    <h1>Formularios con tabla</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td><label for="nombre">Nombre:</label></td>
                <td><input type="text" id="nombre" name="nombre" required></td>
            </tr>
            <tr>
                <td><label for="email">Correo Electrónico:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </td>
            </tr>
            <tr>
                <td><label for="url">Sitio Web:</label>
                <td><input type="url" id="url" name="url">
                </td>
            </tr>
            <tr>
                <td><label for="buscar">Buscar:</label>
                <td><input type="text" id="buscar" name="buscar">
                </td>
            </tr>
            <!--Tipos Numéricos-->
            <tr>
                <td>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
                </td>
                <td>
                    <label for="Volumen">Volumen:<span id="val-vol">50</span></label>
                    <input type="range" id="Volumen" name="Volumen" min="0" max="120" value="50"
                    oninput="document.getElementById('val-vol').textContent = this.value">
                </td>
            </tr>

        </table>
        <input type="submit" value="Enviar">

    </form>
</body>
</html>
