<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" ><br><br>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" ><br><br>

        <input type="submit" value="Enviar">
    </form>

    <h1>Formularios con tabla</h1>
    <form>
        <table>
            <tr>
                <td><label for="nombre">Nombre:</label></td>
                <td><input type="text" id="nombre" name="nombre"></td>
            </tr>
            <tr>
                <td><label for="email">Correo Electrónico:</label></td>
                <td><input type="email" id="email" name="email" ></td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label>
                </td>
                <td>
                    <input type="password" id="password" name="password">
                </td>
            </tr>
            <tr>
                <td><label for="url">Sitio Web:</label></td>
                <td><input type="url" id="url" name="url">
                </td>
            </tr>
            <tr>
                <td><label for="buscar">Buscar:</label></td>
                <td><input type="text" id="buscar" name="buscar">
                </td>
            </tr>
        
            <!--Tipos Numéricos-->
            <tr>
                <td colspan="2">
                    <h3>Tipos Numéricos</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
                </td>
                <td>
                    <label for="Volumen">Volumen:<span id="val-vol">50</span></label>
                    <input type="range" id="Volumen" name="Volumen" min="0" max="120" value="50" oninput="document.getElementById('val-vol').textContent = this.value">
                </td>
            </tr>

            <!-- Tipos de Fecha y Hora-->
            <tr>
                <td colspan="2">
                    <h3>Tipos de Fecha y Hora</h3>
                </td>
            </tr>
            <tr>
                <td>
                   <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" name="fecha">
                </td>
                <td>
                   <label for="hora">Hora de la Cita:</label>
                    <input type="time" id="hora" name="hora">
                </td>
            </tr>
            <tr>
                <td>
                   <label for="evento">Inicio del evento:</label>
                    <input type="date" id="evento" name="evento">
                </td>
                <td>
                   <label for="mes">Mes de Inicio:</label>
                    <input type="month" id="mes" name="mes">
                </td>
            </tr>

            <!-- Checkbox y Radio -->
            <tr>
                <td colspan="2">
                    <h3>Checkbox y Radio</h3>
                </td>
            </tr>
            <tr>
                <td>
                   <label for="acepto">Acepto los términos y condiciones.</label>
                    <input type="checkbox" id="acepto" name="acepto" value="si">
                </td>
                <td>
                   <fieldset>
                    <legend>Método de Pago</legend>
                    <input type="radio" id="tarjeta" name="pago" value="tarjeta">
                    <label for="tarjeta">Tarjeta de Crédito</label><br>
                    <input type="radio" id="efectivo" name="pago" value="efectivo">
                    <label for="efectivo">Efectivo</label><br>
                    <input type="radio" id="transferencia" name="pago" value="transferencia">
                    <label for="transferencia">Transferencia Bancaria</label>
                   </fieldset>
                </td>
            </tr>

            <!-- Tipos Útiles -->
            <tr>
                <td colspan="2">
                    <h3>Tipos Útiles</h3>
                </td>
            </tr>
            <tr>
                <td>
                   <label for="color">Color:</label>
                    <input type="color" id="color" name="color" value="#3b82f6">
                </td>
                <td>
                    <label for="foto">Foto de perfil:</label>
                    <input type="file" id="foto" name="foto">
                </td>
            </tr>
            <tr>
                <td>
                   <label for="docs">Documentos:</label>
                    <input type="file" id="docs" name="docs" accept=".pdf,.doc,.docx">
                </td>
                <td>
                    <input type="hidden" id="token" name="token" value="abcd123xyz">
                </td>
            </tr>
                        
            <!-- Textarea y Select -->
            <tr>
                <td colspan="2">
                    <h3>Textarea y Select</h3>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                   <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." rows="4" cols="50"></textarea>
                </td>
            <!--Select Basico-->
                <td colspan="2">
                    <label for="pais">Selecciona tu Nacionalidad:</label><br>
                    <select id="pais" name="pais">
                        <option value="">-- Elige tu Nacionalidad --</option>
                        <option value="colombia">Colombia</option>
                        <option value="mexico">México</option>
                        <option value="argentina">Argentina</option>
                        <option value="ecuador">Ecuador</option>                        
                    </select>
                </td>
            </tr>
            <!--Select con optgroup-->
            <tr>
                <td colspan="2">
                    <label for="ciudad">Selecciona tu Ciudad:</label><br>
                    <select id="ciudad" name="ciudad">
                        <optgroup label="colombia">
                            <option value="bogota">Bogotá</option>
                            <option value="medellin">Medellín</option>
                            <option value="cali">Cali</option>
                        </optgroup>
                        <optgroup label="mexico">
                            <option value="mexico-city">Ciudad de México</option>
                            <option value="guadalajara">Guadalajara</option>
                            <option value="monterrey">Monterrey</option>
                        </optgroup>
                        <optgroup label="argentina">
                            <option value="buenos-aires">Buenos Aires</option>
                            <option value="cordoba">Córdoba</option>
                            <option value="rosario">Rosario</option>
                        </optgroup>
                        <optgroup label="ecuador">
                            <option value="quito">Quito</option>
                            <option value="guayaquil">Guayaquil</option>
                            <option value="cuenca">Cuenca</option>
                        </optgroup>
                     </select>
                </td>
                <td>
                    <!--Seleccion Multiple-->
                    <label for="skills">Selecciona tus Habilidades:</label><br>
                    <select id="skills" name="habilidades[]" multiple size="4">
                        <option value="programacion">Programación</option>
                        <option value="diseño">Diseño Gráfico</option>
                        <option value="marketing">Marketing Digital</option>
                        <option value="gestion">Gestión de Proyectos</option>
                    </select>
                </td>
            </tr>

        </table>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar Formulario</button>
        <button type="button">Aceptar</button>
    </form>
</body>
</html>
