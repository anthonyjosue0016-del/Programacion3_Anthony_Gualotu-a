<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios de Recursos Humanos</title>
</head>
<body>
    <h1>Audios de Capacitación y Comunicación RRHH</h1>

    <!--Audio básico de inducción-->
    <h2>Audio de Bienvenida Corporativa</h2>
    <audio controls
        src="audios/AUDIO_MP3.mp3"><br>
    </audio>

    <!--Audio de políticas en formato OGG-->
    <h2>Políticas de Recursos Humanos</h2>
    <audio controls>
        <source src="audios/AUDIO_OGG.ogg" type="audio/ogg">
    </audio>

    <!--Audio de capacitación en formato WAV-->
    <h2>Capacitación en Liderazgo</h2>
    <audio controls>
        <source src="audios/AUDIO_WAV.wav" type="audio/wav">
    </audio>

    <!--Audio continuo de música corporativa-->
    <h2>Música Corporativa (Fondo)</h2>
    <audio controls
        src="audios/AUDIO_MP3.mp3" autoplay loop>
    </audio>
</body>
</html>
