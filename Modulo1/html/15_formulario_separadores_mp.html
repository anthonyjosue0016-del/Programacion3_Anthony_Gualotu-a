<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con Separadores - RRHH</title>
</head>
<body>
    <h1>Formularios de Recursos Humanos con Separadores</h1>
    <form>
        <fieldset>
            <legend>Datos Personales del Empleado</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" ><br>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido"><br>
            <label for="cedula">Cédula:</label>
            <input type="text" id="cedula" name="cedula"><br>
        </fieldset>
        <fieldset>
            <legend>Información Laboral</legend>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo"><br>
            <label for="departamento">Departamento:</label>
            <input type="text" id="departamento" name="departamento"><br>
            <label for="salario">Salario Base:</label>
            <input type="number" id="salario" name="salario" min="0"><br>
        </fieldset>
        <fieldset>
            <legend>Datos de Acceso al Sistema</legend>
            <label for="email">Correo Corporativo:</label>
            <input type="email" id="email" name="email"><br><br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" ><br><br>
            <label for="confirmar">Confirmar Contraseña:</label>
            <input type="password" id="confirmar" name="confirmar" ><br><br>
        </fieldset>
        <button type="submit">Crear Perfil de Empleado</button>
    </form>

</body>
</html>
