<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios con Validación - RRHH</title>
</head>
<body>
    <h1>Formularios de RRHH con Validación</h1>
    <form>
        <fieldset>
            <legend>Campo obligatorio</legend>
            <label for="nombre">Nombre del Empleado:</label>
            <input type="text" id="nombre" name="nombre" required><br>
        </fieldset>
        <fieldset>
            <legend>Longitud de texto</legend>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" minlength="2" maxlength="50"><br>
        </fieldset>
        <fieldset>
            <legend>Patrón - Cédula Ecuatoriana</legend>
            <label for="cedula">Número de Cédula:</label>
            <input type="text" id="cedula" name="cedula" pattern="[0-9]{10}" title="Ingrese una cédula válida de 10 dígitos"><br>
        </fieldset>
        <fieldset>
            <legend>Rango de edad laboral</legend>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="18" max="65"><br>
        </fieldset>
        <fieldset>
            <legend>Código de empleado (solo lectura)</legend>
            <label for="codigo">Código de Empleado:</label>
            <input type="text" id="codigo" name="codigo" value="EMP-001" readonly><br>
        </fieldset>
        <fieldset>
            <legend>País (deshabilitado)</legend>
            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais"  value="Ecuador" disabled><br>
        </fieldset>
        <button type="submit">Validar y Registrar</button>
    </form>

</body>
</html>
