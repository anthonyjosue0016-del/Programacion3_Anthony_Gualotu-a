<!DOCTYPE html>
<htlm lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audios</title>
</head>
<body>
    <h1>Audios</h1>
    <!--Basico-->
    <h1>Audio MP3</h1>
    <audio controls
        src="audios/AUDIO_MP3.mp3"><br>
    </audio>
    <h1>Audio OGG</h1>
    <audio controls>
        <source src="audios/AUDIO_OGG.ogg" type="audio/ogg">
    </audio>
    <h1>Audio WAV</h1>
    <audio controls>
        <source src="audios/AUDIO_WAV.wav" type="audio/wav">
    </audio>
    <h1>Audio Continuo</h1>
    <audio controls
        source src="audios/AUDIO_MP3.mp3" autoplay loop>
    </audio>
</body>
</html>
